name: Apply deterministic type paths

on:
  push:
    branches:
      - 'fix/deterministic-import-type-paths'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'fix/deterministic-import-type-paths'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - name: Apply scoped source rewrite
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/analyze/utils/getExportMetadata.ts')
          source = path.read_text()
          replacements = [
              (
                  "import { getParadoxComment } from './getParadoxComment.js';\nimport { parseParadoxComment } from './parseParadoxComment.js';",
                  "import { getParadoxComment } from './getParadoxComment.js';\nimport { normalizeTypeText } from './normalizeTypeText.js';\nimport { parseParadoxComment } from './parseParadoxComment.js';",
              ),
              (
                  '  const signatures = getSignatures(options.symbol, options.node);',
                  '  const signatures = getSignatures(options.symbol, options.node, options.root);',
              ),
              (
                  '  const members = getMembers(options.node);',
                  '  const members = getMembers(options.node, options.root);',
              ),
              (
                  'function getSignatures(symbol: MorphSymbol, node: Node): AnalysisSignature[] {',
                  'function getSignatures(symbol: MorphSymbol, node: Node, root: string): AnalysisSignature[] {',
              ),
              (
                  '    getSignature(declaration, parsed.params, parsed.returns),',
                  '    getSignature(declaration, parsed.params, parsed.returns, root),',
              ),
              (
                  '  returns: string | null,\n): AnalysisSignature {',
                  '  returns: string | null,\n  root: string,\n): AnalysisSignature {',
              ),
              (
                  '      type: parameter.getType().getText(parameter),',
                  '      type: normalizeTypeText(parameter.getType().getText(parameter), root),',
              ),
              (
                  '  const returnType = declaration.getReturnType().getText(declaration);',
                  '  const returnType = normalizeTypeText(declaration.getReturnType().getText(declaration), root);',
              ),
              (
                  'function getMembers(node: Node): AnalysisMember[] {',
                  'function getMembers(node: Node, root: string): AnalysisMember[] {',
              ),
              (
                  '    return getMembersFromProperties(node.getType().getProperties());',
                  '    return getMembersFromProperties(node.getType().getProperties(), root);',
              ),
              (
                  '    return getMembersFromProperties(node.getType().getProperties());',
                  '    return getMembersFromProperties(node.getType().getProperties(), root);',
              ),
              (
                  'function getMembersFromProperties(properties: readonly MorphSymbol[]): AnalysisMember[] {',
                  'function getMembersFromProperties(\n  properties: readonly MorphSymbol[],\n  root: string,\n): AnalysisMember[] {',
              ),
              (
                  '        type: property.getTypeAtLocation(declaration).getText(declaration),',
                  '        type: normalizeTypeText(\n          property.getTypeAtLocation(declaration).getText(declaration),\n          root,\n        ),',
              ),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'Missing expected source fragment: {old!r}')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY
      - run: bun run lint:fix
      - run: bun run format
      - run: bun run build
      - run: bun run test
      - run: bun run knip
      - run: bun run docs
      - run: bun run format
      - run: npm pack --dry-run
      - name: Commit validated source and generated docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Normalize generated import type paths'
          git push origin HEAD:'fix/deterministic-import-type-paths'
