name: Docs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Run typecheck
        run: bun run typecheck

      - name: Run build
        run: bun run build

      - name: Run tests
        run: bun run test

      - name: Check changesets
        if: github.event_name == 'pull_request'
        run: |
          if [ -f ./scripts/check-changeset-status.sh ]; then
            bash ./scripts/check-changeset-status.sh
          else
            bun run changeset:status
          fi

      - name: Generate docs
        run: bun run docs

      - name: Format generated docs
        run: ./node_modules/.bin/ankhorage-prettier --write README.md paradox

      - name: Validate generated docs scope
        run: |
          changed="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(README\.md|paradox/)' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error title=Docs generation modified non-generated files::$unexpected"
            exit 1
          fi
          ./node_modules/.bin/ankhorage-prettier --check README.md paradox
