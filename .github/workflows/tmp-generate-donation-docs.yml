name: Temporary Donation Docs Generation

on:
  push:
    branches:
      - feat/80-donation-support

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/80-donation-support
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate docs
        run: bun run docs

      - name: Format generated docs
        run: bun run format

      - name: Commit generated artifacts
        run: |
          git add README.md paradox .github/FUNDING.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate donation artifacts"
          git push origin HEAD:feat/80-donation-support
