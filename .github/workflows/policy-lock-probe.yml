name: Policy lock probe

on:
  pull_request:
    paths:
      - '.github/workflows/policy-lock-probe.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Resolve Policy 0.2.1 lock
        run: |
          bun install --lockfile-only
          grep -F '"@ankhorage/policy": ["@ankhorage/policy@0.2.1"' bun.lock
          git diff -- bun.lock
